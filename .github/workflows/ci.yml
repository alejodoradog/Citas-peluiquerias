name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: The production CSS carries the design tokens
        run: |
          for token in --color-brand-soft --color-line-strong --radius-button --text-title; do
            grep -rlq -- "$token" .next/static --include=*.css || { echo "::error::$token is missing from the production CSS"; exit 1; }
          done
      - name: The component catalog is not in the production build
        run: |
          pnpm start &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3000/terminos && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/terminos)" = 200
          # /_catalogo now falls on the barbershop link ([slug]), which streams
          # "not found" with a 200: what matters is that the catalog is not there.
          page="$(curl -s http://localhost:3000/_catalogo)"
          if echo "$page" | grep -q "Catálogo de F-01"; then echo "::error::the component catalog is in the production build"; exit 1; fi
          echo "$page" | grep -q "No encontramos"

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start
      - run: pnpm supabase test db
      - name: Generated types match the migrations
        run: |
          pnpm db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts

  e2e:
    runs-on: ubuntu-latest
    # Up to three browser install tries of 8 minutes, plus the tests.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start
      - name: Point the app at the local Supabase
        run: node scripts/ci/supabase-env.mjs >> "$GITHUB_ENV"
      - name: Cache the Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The browsers' system packages come from apt, whose mirrors the
      # runners sometimes cannot reach. The workflow "Browser packages" keeps
      # them in a cache from main; without it, they are downloaded with
      # retries (scripts/ci/browser-packages.sh).
      - name: Name the browser packages cache
        id: browser-debs
        run: echo "key=browser-debs-${ImageOS}-${ImageVersion}-$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Restore the browser packages
        uses: actions/cache/restore@v5
        with:
          path: ~/browser-debs
          key: ${{ steps.browser-debs.outputs.key }}
      - name: Install the browsers
        run: bash scripts/ci/browser-packages.sh install
      - run: pnpm test:e2e
      - name: Keep the report, with the side-by-side screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
