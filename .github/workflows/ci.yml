name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: The production CSS carries the design tokens
        run: |
          for token in --color-brand-soft --color-line-strong --radius-button --text-title; do
            grep -rlq -- "$token" .next/static --include=*.css || { echo "::error::$token is missing from the production CSS"; exit 1; }
          done
      - name: The component catalog is not in the production build
        run: |
          pnpm start &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3000/terminos && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/terminos)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/_catalogo)" = 404

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start
      - run: pnpm supabase test db
      - name: Generated types match the migrations
        run: |
          pnpm db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts

  e2e:
    runs-on: ubuntu-latest
    # Up to three browser install tries of 8 minutes, plus the tests.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start
      - name: Point the app at the local Supabase
        run: node scripts/ci/supabase-env.mjs >> "$GITHUB_ENV"
      - name: Cache the Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The system packages come from apt, which is sometimes very slow. Each
      # try gets 8 minutes; a try that times out leaves apt running, so it is
      # stopped and its lock released before the next one.
      - name: Install the browsers
        run: |
          for try in 1 2 3; do
            if timeout -k 15 480 pnpm exec playwright install --with-deps chromium webkit; then
              exit 0
            fi
            echo "::warning::Browser install try $try did not finish"
            sudo pkill -9 -f 'apt-get|dpkg' || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
          done
          exit 1
      - run: pnpm test:e2e
      - name: Keep the report, with the side-by-side screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
